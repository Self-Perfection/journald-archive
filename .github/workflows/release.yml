name: Release

# Triggered by pushing a version tag (e.g. v0.3.0). Builds the .deb clean-room
# from exactly the tagged commit, gates on the release checklist, then creates
# the GitHub Release with the .deb attached and the top changelog entry as its
# body. Building from the tag (not a
# developer's working tree) guarantees the embedded changelog matches what is
# published.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential debhelper dpkg-dev fakeroot lintian

      - name: Verify changelog matches tag
        run: |
          changelog=packaging/deb/debian/changelog
          version=$(dpkg-parsechangelog -l "$changelog" -S Version)
          dist=$(dpkg-parsechangelog -l "$changelog" -S Distribution)
          tag=${GITHUB_REF_NAME#v}
          echo "tag=$tag  changelog version=$version  distribution=$dist"
          if [ "$dist" = UNRELEASED ]; then
            echo "::error::Top changelog entry is UNRELEASED — finalize it before tagging."
            exit 1
          fi
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag v$tag does not match changelog version $version."
            exit 1
          fi

      - name: Build package
        run: make -C packaging/deb build

      - name: Lint package
        run: make -C packaging/deb lint

      - name: Build release notes from the changelog
        run: |
          # The release body is the top changelog entry — the same text that
          # ships inside the .deb — so the release says what changed instead of
          # only linking a commit range. dpkg-parsechangelog prints the entry
          # with a leading blank line, the source header and a "." separator
          # (dropped by tail), body indented by two spaces (undented into
          # Markdown bullets, wrapped lines staying indented under them), and
          # any blank line inside the entry as a lone "." (turned back into a
          # blank line). Built after the package so it cannot end up in it.
          dpkg-parsechangelog -l packaging/deb/debian/changelog -S Changes --count 1 \
            | tail -n +4 | sed -e 's/^  //' -e 's/^\.$//' > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: packaging/deb/dist/*.deb
          fail_on_unmatched_files: true
          # body_path is prepended to the notes GitHub generates from the
          # commits/PRs in the range, which stay on as the "Full Changelog"
          # trailer below it.
          body_path: release-notes.md
          generate_release_notes: true
